plugins {
    id 'java-library'
    id 'maven-publish'
}

// Java 17 source/target. The FTC SDK runs on Android API 24+, whose desugaring
// accepts Java 17 class files for this module's feature set (no records, no
// sealed types, no switch patterns -- see the style note in README).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options {
        encoding = 'UTF-8'
        // The library is documented for teams reading it in an IDE, so the
        // generated HTML should carry the same detail the source does.
        addStringOption('Xdoclint:none', '-quiet')
        links 'https://docs.oracle.com/en/java/javase/17/docs/api/'
    }
    title = "PlatapusPathing ${project.version}"
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        core(MavenPublication) {
            artifactId = 'platapuspathing-core'
            from components.java
        }
    }
}
